<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFerraz | Software Developer</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- <link rel="icon" href="./assets/favicon.png"> -->
    <script src="./script.js"></script>
    <script src="https://kit.fontawesome.com/458abe86a2.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bytesized&family=Doto:wght@100..900&family=Handjet:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">

</head>
<body>
    
    
    <header>
        <a href="#" class="logo">
            <img src="./assets/bolt.svg" alt="Bolt">
        </a>
        <nav>
            <ul id="menu">
                <li>
                    <a href="#" class="button-one">home</a>
                </li>
                <li>
                    <a href="#" class="button-two">projects</a>
                </li>
                <li>
                    <a href="#" class="button-three">contact</a>
                </li>
            </ul>
            <a href="#" class="mobile-toggle" onClick="toggleMobileMenu()">
                <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/>
                </svg>
            </a>
        </nav>
    </header>
    <div class="background" id="bottom"></div>
    <main>
        <section class="container">
            <div class="my-name">
                    <h2>Hello, I'm </h2>
                    <h1>Jefferson</h1>
            </div>
            <div class="description">
                <p id="typewriter"></p>
            </div>
        </section>
    </main>
    <div class="background" id="top"></div>
    <footer>
        <span>
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-linkedin"></i>
            <i class="fab fa-instagram"></i>
        </span>
        <p>created by <big>Jefferson</big></p>
    </footer>
    <script>
        const text = "...a self-taught beginner web developer, from Brazil. Recently I've been starting to dive into JavaScript.";
        let index = 0;
        function type() {
            if (index < text.length) {
                document.getElementById("typewriter").textContent += text[index];
                index++;
                setTimeout(type, 50);
            }
        }
        type();
    </script>
</body>
</html>
